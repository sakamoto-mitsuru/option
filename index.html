<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>itowa｜付属品オプション 注文画面デモ</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Shippori+Mincho:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#f5f0e8;--paper:#ffffff;--ink:#3a3228;--muted:#9a8f7e;--line:#eeeeee;--primary:#635e7a;--gold:#b0925a;--soft:#f5f0e8;--green:#2a6040}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:"Noto Sans JP",sans-serif;color:var(--ink)}
.app{max-width:940px;margin:0 auto;background:var(--bg);min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.06);display:flex;flex-direction:column}
.mser{font-family:"Shippori Mincho",serif}
.mhead{background:#fff;color:var(--ink);height:56px;padding:0 16px;position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center}
.brand svg{display:block}
.mhead-acc{background:none;border:none;color:#4a4a4a;cursor:pointer;padding:4px;display:flex;align-items:center}
.mhead-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:"Shippori Mincho",serif;font-size:15px;color:var(--ink);white-space:nowrap;max-width:62%;overflow:hidden;text-overflow:ellipsis;text-align:center;pointer-events:none}
.tabs{display:flex;gap:2px;max-width:640px;margin:0 auto}
.tabs a{flex:1;text-align:center;color:rgba(255,255,255,.7);font-size:13px;padding:10px 0;border-bottom:2px solid transparent;cursor:pointer}
.tabs a.on{color:#fff;border-bottom-color:var(--gold);font-weight:600}
.stepper{position:sticky;top:56px;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);display:flex;padding:11px 8px;max-width:640px;margin:0 auto;width:100%}
.stepper .st{flex:1;text-align:center;font-size:11.5px;color:var(--muted)}
.stepper .st .n{width:26px;height:26px;border-radius:50%;background:var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;margin:0 auto 3px;font-size:13px;font-weight:700}
.stepper .st.on .n{background:var(--primary);color:#fff}
.stepper .st.done .n{background:var(--green);color:#fff}
.stepper .st.on{color:var(--primary);font-weight:700}
.content{flex:1;padding:18px 20px 130px;max-width:720px;margin:0 auto;width:100%}
.obi{background:linear-gradient(180deg,#fbfaf7,#f4f0e8);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px;display:flex;gap:14px;align-items:center}
.obi .ph{width:66px;height:82px;border-radius:8px;background:#e8e3d8;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#c3bba8;font-size:26px}
.obi .nm{font-family:"Shippori Mincho",serif;font-size:17px;margin-bottom:5px}
.obi .meta{font-size:12px;color:var(--muted);line-height:1.8}
.sec-lead{font-family:"Shippori Mincho",serif;font-size:17px;margin:4px 0 14px;display:flex;align-items:center;gap:8px}
.sec-lead i{color:var(--gold)}
.chips{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.chip{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600}
.prod-list{display:flex;flex-direction:column;gap:12px}
.pcard{border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;transition:.15s;display:flex;gap:12px;padding:12px;align-items:stretch}
.pcard:hover{box-shadow:0 6px 18px rgba(0,0,0,.08);transform:translateY(-1px)}
.pcard-img{width:96px;flex-shrink:0;border-radius:8px;background:#f3efe8;overflow:hidden}
.pcard-img img{width:100%;height:100%;object-fit:cover}
.pcard-body{display:flex;flex-direction:column;flex:1;min-width:0}
.pcat{font-size:11px;color:var(--gold);margin-bottom:3px}
.pnm{font-size:14.5px;font-weight:600;line-height:1.45;margin-bottom:4px}
.pcode{font-size:11px;color:var(--muted)}
.pcard-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px}
.pprice{font-size:17px;font-weight:700;font-family:"Shippori Mincho",serif}
.addbtn2{border:1px solid var(--primary);background:#fff;color:var(--primary);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.addbtn2:hover{background:var(--primary);color:#fff}
.deadline{font-size:11.5px;color:#a9683b;background:#faf1e8;border-radius:6px;padding:3px 9px;display:inline-block;margin-bottom:12px}
.dl-box{background:#faf1e8;border:1px solid #eaddc9;border-radius:10px;padding:11px 13px 10px;margin-bottom:12px}
.dl-head{font-size:13px;font-weight:700;color:#8a5a2b;margin-bottom:7px;display:flex;align-items:center;gap:7px}
.dl-row{font-size:12.5px;color:#6b4b2a;line-height:1.75;display:flex;gap:6px}
.dl-row .t{color:#a9683b;font-weight:700;white-space:nowrap}
.dl-urgent{margin-top:9px;background:#fff4e6;border:1px solid #f3d3a0;color:#b26a00;border-radius:8px;padding:8px 11px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px;line-height:1.6}
.dl-cere{font-size:12px;color:#6b4b2a;margin-bottom:9px;padding-bottom:8px;border-bottom:1px dashed #eaddc9;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dl-cere .t{color:#8a5a2b;font-weight:700}
.dl-tabs{display:flex;gap:6px;margin-bottom:9px;flex-wrap:wrap}
.dl-tab{border:1px solid #eaddc9;background:#fff;border-radius:999px;padding:5px 14px;font-size:12px;cursor:pointer;color:#8a5a2b;font-weight:600}
.dl-tab.on{background:#8a5a2b;color:#fff;border-color:#8a5a2b}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.toggle button{border:none;background:#fff;padding:10px 20px;font-size:14px;cursor:pointer;color:var(--muted)}
.toggle button.on{background:var(--primary);color:#fff;font-weight:600}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12.5px;color:#555;margin-bottom:5px;font-weight:500}
.fld input,.fld select{width:100%;border:1px solid #d6d0c4;border-radius:9px;padding:11px 12px;font-size:15px;font-family:inherit;background:#fff}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--primary)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.qchip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--soft);font-size:12px;cursor:pointer}
.qchip:hover{background:var(--primary);color:#fff}
.qchip.on{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:600}
.namerow{border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:10px;background:#fcfbf8}
.addbtn{border:1px dashed #c9c1b0;background:#fff;border-radius:9px;padding:10px;width:100%;font-size:13px;color:var(--primary);cursor:pointer}
.mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;font-size:12px;cursor:pointer}
.badge{margin-left:auto;font-size:11px;padding:3px 9px;border-radius:999px;font-weight:600}
.lbl-2col{display:flex;gap:18px;align-items:flex-start}
.lbl-form{flex:1;min-width:0}
.lbl-fuda-col{flex-shrink:0;position:sticky;top:110px;align-self:flex-start}
.fuda-wrap-s{display:flex;flex-direction:column;align-items:center}
.fuda{aspect-ratio:95/280;width:auto;height:274px;background:#fff;border:1px solid #c8b88a;padding:13px 8px 15px;display:flex;flex-direction:column;align-items:center;font-family:"Yuji Syuku","Yu Mincho","Noto Serif JP",serif;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.fuda-hd{display:flex;gap:6px;margin-bottom:13px}
.fuda-hd span{font-size:23px;line-height:1;color:#1a1a1a}
.fuda-body{display:flex;flex-direction:column;align-items:center;gap:12px;flex:1}
.fuda-row{display:flex;flex-direction:row-reverse;align-items:flex-start;justify-content:center;gap:9px}
.fuda-col{display:flex;flex-direction:column;align-items:center;color:#1a1a1a}
.fuda-note{font-size:10.5px;color:#8a7f66;margin-top:10px;text-align:left;width:210px;line-height:1.65;background:#fbf7ef;border:1px solid #ece2cc;border-radius:8px;padding:9px 11px}
.pay-opt{border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:11px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;background:#fff}
.pay-opt.on{border-color:var(--primary);box-shadow:0 0 0 2px rgba(74,69,96,.15)}
.pay-opt .radio{width:20px;height:20px;border-radius:50%;border:2px solid #c9c1b0;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center}
.pay-opt.on .radio{border-color:var(--primary)}
.pay-opt.on .radio:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary)}
.pay-opt .t{font-weight:600;font-size:14.5px}
.pay-opt .d{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.6}
.sumrow{display:flex;justify-content:space-between;font-size:13.5px;padding:8px 0;border-bottom:1px dashed var(--line);gap:10px}
.sumrow span:first-child{flex:1}
.sumrow.total{font-size:18px;font-weight:700;border-bottom:none;padding-top:13px;font-family:"Shippori Mincho",serif}
.botbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:940px;background:rgba(255,255,255,.97);backdrop-filter:blur(6px);border-top:1px solid var(--line);z-index:25}
.botbar-inner{max-width:720px;margin:0 auto;padding:13px 20px;display:flex;gap:12px;align-items:center}
.botbar .tt{font-size:11px;color:var(--muted)}
.botbar .tv{font-size:19px;font-weight:700;font-family:"Shippori Mincho",serif}
.btn{border:none;border-radius:11px;padding:14px 20px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-p{background:var(--primary);color:#fff;flex:1}
.btn-p:disabled{background:#cfcabc;cursor:not-allowed}
.btn-g{background:#fff;border:1px solid var(--line);color:var(--ink)}
.hint{font-size:12px;color:var(--muted);line-height:1.7}
.complete{text-align:center;padding:50px 20px}
.complete .ico{width:80px;height:80px;border-radius:50%;background:#eaf3ec;color:var(--green);display:flex;align-items:center;justify-content:center;font-size:38px;margin:0 auto 20px}
.legacy-note{font-size:11.5px;color:#9a6a3a;background:#fbf3e9;border:1px solid #efdcc4;border-radius:8px;padding:9px 11px;margin-bottom:14px;line-height:1.6}
.urlbar{font-size:11px;color:#b7b1a3;text-align:center;padding:7px;border-bottom:1px solid var(--line);background:#f7f4ee;font-family:monospace;word-break:break-all}
.topnav{display:flex;background:#fff;border-bottom:1px solid var(--line)}
.topnav a{flex:1;text-align:center;font-size:14px;padding:12px 0;color:var(--muted);text-decoration:none;cursor:pointer}
.topnav a.on{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--ink)}
.decname{text-align:center;font-size:13px;color:var(--ink);padding:9px 8px;background:var(--paper);border-bottom:1px solid var(--line)}
.decname b{font-family:"Shippori Mincho",serif;font-size:15px}
.botnav{display:none;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:940px;background:#fff;border-top:1px solid var(--line);z-index:40;height:56px}
.botnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;letter-spacing:.4px;color:var(--muted);text-decoration:none;cursor:pointer}
.botnav a.on{color:var(--ink);font-weight:600}
.botnav a svg{display:block}
.req{color:#c0392b}
input::placeholder,textarea::placeholder{color:#c9c2b4;opacity:1}
.addr-res{font-size:12.5px;border-radius:9px;padding:9px 11px;margin-bottom:12px;line-height:1.6}
.addr-res.ok{background:#eaf3ec;color:#2a6040;border:1px solid #cfe4d6}
.addr-res.warn{background:#fbf3e9;color:#9a6a3a;border:1px solid #efdcc4}
.addr-res.info{background:#eef2fb;color:#3a4a6a;border:1px solid #c5d3ef}
.addr-cand{display:flex;gap:8px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;font-size:13px;cursor:pointer;background:#fff}
.addr-cand.on{border-color:var(--primary);background:#f3f2f7}
.modal-ov{position:fixed;inset:0;background:rgba(30,28,36,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal-ov.show{display:flex}
.modal-card{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:0;overflow:hidden;position:relative;max-height:90vh;overflow-y:auto}
.mclose{position:absolute;top:10px;right:12px;background:rgba(255,255,255,.85);border:none;width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer;z-index:2}
.pm-img{width:100%;aspect-ratio:1/1;background:#f3efe8;overflow:hidden}
.pm-img img{width:100%;height:100%;object-fit:cover}
.pm-body{padding:18px}
.pm-cat{font-size:12px;color:var(--gold);margin-bottom:5px}
.pm-nm{font-size:19px;font-weight:700;font-family:"Shippori Mincho",serif;margin-bottom:6px;line-height:1.4}
.pm-code{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.pm-price{font-size:22px;font-weight:700;font-family:"Shippori Mincho",serif;margin:10px 0 16px}
@media(max-width:560px){
  .content{padding:16px 15px 190px}
  .topnav{display:none}
  .botnav{display:flex}
  .botbar{bottom:56px}
  .pcard-img{width:82px}
  .pnm{font-size:13.5px}.pprice{font-size:15px}
  .addbtn2{padding:7px 12px;font-size:12px}
  .lbl-2col{gap:10px}
  .fuda{aspect-ratio:95/280;width:auto;height:238px;padding:9px 5px 11px}
  .fuda-hd span{font-size:18px}
  .fuda-hd{margin-bottom:9px}
  .grid2{grid-template-columns:1fr 1fr}
}
@media(max-width:400px){.pcard-img{width:72px}}
@keyframes upfade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
</style></head>

function fudaGlyphs(str,fp){const DASH=['ー','ｰ','－','‐','‑','‒','–','—','―','−','〜','～','~','-'];return Array.from(str).map(ch=>{if(ch===' '||ch==='　')return `<span style="display:block;height:${Math.round(fp*0.5)}px"></span>`;const rot=DASH.includes(ch)?'transform:rotate(90deg);':'';return `<span style="display:block;font-size:${fp}px;line-height:1.12;${rot}">${esc(ch)}</span>`;}).join('');}
function fudaSpacer(px){return px>0?`<span style="display:block;height:${Math.round(px)}px"></span>`:'';}
function fudaHtml(l){
  const bodyH=180,innerW=61,LH=1.15;
  const wrap=rows=>`<div class="fuda"><div class="fuda-hd"><span>御</span><span>供</span></div><div class="fuda-body">${rows}</div></div>`;
  const empty=wrap('<div class="fuda-row"><div class="fuda-col" style="color:#bbb;font-size:12px">お名前未入力</div></div>');
  const clen=x=>Array.from(x).length;
  let specs=[];
  if(l.kind==='individual'){
    const es=l.names.filter(n=>n.name.trim()).map(n=>{const nm=n.name.trim();const r=n.isCouple?[0,'',nm]:splitSurname(nm);return {relation:l.withRelation?(n.relation||'').trim():'',surnameLen:r[0],surname:r[1],given:r[2]};});
    const ws=es.filter(e=>e.surnameLen>0);const maxLen=ws.length?Math.max(...ws.map(e=>e.surnameLen)):0;
    specs=es.map(e=>{let head=e.surname,tail=e.given,gapU=0;if(e.surnameLen>0)gapU=0.5+(maxLen-e.surnameLen);else if(maxLen>0){head='';gapU=maxLen+0.5;}const relU=l.withRelation?(e.relation?clen(e.relation)*0.44+0.3:0.44+0.3):0;return {t:'name',relation:e.relation,head,gapU,tail,units:relU+clen(head)+gapU+clen(tail)};});
  }else{
    const c=l.corp;const title=(c.title||'').trim();const org=c.company.trim();const name=c.name.trim();
    if(org)specs.push({t:'org',text:org,units:clen(org)*0.72});
    if(name||title)specs.push({t:'cname',title,name,units:(title?clen(title)*0.44+0.3:0)+clen(name)});
  }
  if(!specs.length)return empty;
  let rows;
  if(l.kind==='individual'){const N=specs.length;if(N<=4)rows=[specs];else{const top=Math.ceil(N/2);rows=[specs.slice(0,top),specs.slice(top)];}}else rows=[specs];
  const numRows=rows.length,maxColUnits=Math.max(1,...specs.map(s=>s.units)),maxCols=Math.max(...rows.map(r=>r.length));
  let NF=Math.round(Math.min(bodyH*0.9/(numRows*maxColUnits*LH),innerW/(maxCols*1.35)));NF=Math.max(6,Math.min(36,NF));
  const OF=Math.round(NF*0.72),TF=Math.round(NF*0.44);
  const rc=s=>{
    if(s.t==='org')return `<div class="fuda-col">${fudaGlyphs(s.text,OF)}</div>`;
    if(s.t==='cname'){let inn='';if(s.title)inn+=fudaGlyphs(s.title,TF)+fudaSpacer(NF*0.3);inn+=fudaGlyphs(s.name,NF);return `<div class="fuda-col">${inn}</div>`;}
    let inn='';
    if(l.kind==='individual'&&l.withRelation)inn+=(s.relation?fudaGlyphs(s.relation,TF)+fudaSpacer(NF*0.3):fudaSpacer(Math.round(TF*LH+NF*0.3)));
    if(s.head)inn+=fudaGlyphs(s.head,NF);
    if(s.gapU>0)inn+=fudaSpacer(s.gapU*NF*LH);
    inn+=fudaGlyphs(s.tail,NF);
    return `<div class="fuda-col">${inn}</div>`;
  };
  return wrap(rows.map(r=>`<div class="fuda-row">${r.map(rc).join('')}</div>`).join(''));
}
function toKatakana(x){return (x||'').replace(/[ぁ-ん]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60));}

function parseDL(str){const m=(str||'').match(/(\d+)\/(\d+)[^\d]*(\d+):(\d+)/);return m?new Date(2026,+m[1]-1,+m[2],+m[3],+m[4]):null;}
const MOCK_NOW=new Date(2026,6,28,14,20); // デモ用の現在時刻（本番は new Date()）。通夜締切15:00の40分前＝1時間前督促が表示される想定。
function urgencyMsg(cats){
  return ''; // デモ版：締切直前の警告は表示しない
  const map={kuge:[FUNERAL.wakeDeadline,FUNERAL.funeralDeadline],kouden:[FUNERAL.koudenDeadline]};
  let dls=[];(cats||[]).forEach(c=>{if(map[c])dls=dls.concat(map[c]);});
  if(!dls.length)return ''; // 弔電など締切対象外カテゴリのみのときは警告を出さない
  let best=null;
  dls.forEach(sv=>{const d=parseDL(sv);if(d){const min=(d-MOCK_NOW)/60000;if(min>0&&min<=60&&(!best||min<best.min))best={sv,min};}});
  if(!best)return '';
  return `<div class="dl-urgent"><i class="fas fa-triangle-exclamation"></i> 締切まで1時間を切っています。<b>${best.sv} まで</b>に決済の完了をお願いします。</div>`;
}
function dlRowsFor(cats){

}

  f+=`<div class="fld"><label>お名前 <span class="req">*</span></label>${nameField}</div>`;
  if(cat==='telegram')f+=`<div class="hint" style="margin-top:-4px;margin-bottom:10px"><i class="fas fa-circle-info" style="color:var(--gold)"></i> 弔電（佐川）はお名前・本文とも改行できません。</div>`;
  if(cat==='kuge')f+=noteField(c,ci);
  if(needsMessage(cat)){
    const req=messageRequired(cat);
    f+=`<div class="fld" style="margin-bottom:${cat==='telegram'?'6px':'0'}"><label>${MSG_LABEL[cat]||'メッセージ'}${req?' <span class="req">*</span>':''}</label><textarea rows="4" placeholder="${MSG_PH[cat]||''}" style="width:100%;border:1px solid #d6d0c4;border-radius:9px;padding:11px 12px;font-size:14px;font-family:inherit;resize:vertical;line-height:1.7" oninput="setMessage(${ci},this.value)">${esc(l.message||'')}</textarea></div>`;
    if(cat==='telegram')f+=`<div class="hint">佐川弔電は改行できません。定型文の選択・編集は実装時に対応します。</div>`;
  }
  return f;
}
function noteField(c,ci){

function setCorpType(ci,t){

function searchAddr(z){orderer.addrSearchedZip=z;const res=MOCK_ADDRESS_MASTER[z];if(!res||!res.length){orderer.addrCandidates=[];orderer.addrSelectedId='';orderer.pref='';orderer.addr1='';return;}orderer.addrCandidates=res;if(res.length===1){selectAddrObj(res[0]);}else{orderer.addrSelectedId='';orderer.pref='';orderer.addr1='';}}

function onZipInput(v){orderer.zip=v;const z=v.replace(/[^0-9]/g,'');if(/^\d{7}$/.test(z)){if(orderer.addrSearchedZip!==z){searchAddr(z);renderOrderer();return;}}else if(orderer.addrSearchedZip){orderer.addrSearchedZip='';orderer.addrCandidates=[];orderer.addrSelectedId='';orderer.pref='';orderer.addr1='';renderOrderer();return;}renderBar();}

function addUpsell(uid,key){const it=UPSELL.find(u=>u.key===key);const kk=uid+':'+key;if(!upsell[kk])upsell[kk]={name:it.name,price:it.price,uid:uid,qty:1};renderUpsell();renderBar();}
function bumpUpsell(ev,uid,key,d){ev.stopPropagation();const kk=uid+':'+key;const u=upsell[kk];if(!u)return;const q=(u.qty||1)+d;if(q<1)delete upsell[kk];else if(q>UP_MAX)return;else u.qty=q;renderUpsell();renderBar();}
function optTile(c,u){
  const kk=c.uid+':'+u.key;const st=upsell[kk];const on=!!st;const q=on?(st.qty||1):0;const g=upArt(u.key);
  const stepBtn=(d,ic,dis)=>`<button onclick="bumpUpsell(event,${c.uid},'${u.key}',${d})" ${dis?'disabled':''} aria-label="${d>0?'ひとつ増やす':'ひとつ減らす'}" style="width:22px;height:22px;border-radius:50%;border:1px solid ${dis?'var(--line)':'var(--gold)'};background:#fff;color:${dis?'#ccc':'var(--gold)'};font-size:9px;display:flex;align-items:center;justify-content:center;cursor:${dis?'default':'pointer'};padding:0;font-family:inherit"><i class="fas ${ic}"></i></button>`;
  const stepper=on?`<div onclick="event.stopPropagation()" style="display:flex;align-items:center;justify-content:center;gap:7px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line)">
      ${stepBtn(-1,'fa-minus',false)}<span class="mser" style="font-size:12px;font-weight:700;min-width:12px">${q}</span>${stepBtn(1,'fa-plus',q>=UP_MAX)}

    ?`<div style="position:absolute;top:3px;right:3px;height:15px;min-width:20px;padding:0 4px;border-radius:999px;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;z-index:1">×${q}</div>`
    :`<div style="position:absolute;top:3px;right:3px;width:15px;height:15px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-size:8px;z-index:1"><i class="fas fa-check"></i></div>`):'';
  return `<div onclick="openUpModal(${c.uid},'${u.key}')" style="border:1.5px solid ${on?'var(--gold)':'var(--line)'};border-radius:10px;padding:6px 6px 8px;cursor:pointer;background:#fff;text-align:center;position:relative;transition:border-color .2s ease;${on?'box-shadow:0 2px 9px rgba(176,146,90,.16)':''}">

    <div style="font-size:10px;font-weight:600;line-height:1.25;margin-bottom:2px;min-height:24px;display:flex;align-items:center;justify-content:center">${u.short}</div>
    <div class="mser" style="font-size:11px;font-weight:700;color:var(--gold)">${yen(u.price)}</div>
    ${stepper}
  </div>`;
}

    html+=`<div class="up-flower" style="margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:2px 13px 16px;overflow:visible">
      <div style="display:flex;align-items:center;gap:11px;padding:12px 4px 13px;border-bottom:1px solid var(--line);margin-bottom:2px;position:sticky;top:126px;background:#fff;z-index:15;border-radius:12px 12px 0 0">
        <img src="${IMG}" style="width:74px;height:96px;border-radius:10px;object-fit:cover;flex-shrink:0">
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:700;line-height:1.4">${esc(c.name)}</div>
          <div style="font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.6;white-space:pre-line">名札：${esc(plate)}</div>
          ${cnt>0?`<div style="margin-top:6px"><span style="font-size:10.5px;font-weight:700;color:var(--gold);background:#fdf6e9;border-radius:999px;padding:2px 9px">${cnt}点 お選び中</span></div>`:''}
        </div>
      </div>
      ${catH('fa-dove','旅立ちに添える','ご出棺の前に、故人さまと一緒にお棺にお納めします。','linear-gradient(135deg,#8f86ad,#635e7a)')}
      ${grid(c,c1)}
      ${catH('fa-seedling','会場を彩る','お送りする供花を、より丁寧に・華やかにいたします。','linear-gradient(135deg,#c3a765,#b0925a)')}
      ${grid(c,c2)}
    </div>`;
  });
  html+=`<div class="hint" style="text-align:center;margin-top:20px">お選びいただくと、ご注文金額に含まれます。</div>`;
  C().innerHTML=html;
  upFadeIn();
}
function upFadeIn(){
  const els=[].slice.call(document.querySelectorAll('.up-flower'));
  els.forEach(el=>{if(el.dataset.shown)return;el.style.opacity='0';el.style.transform='translateY(12px)';el.style.transition='opacity .55s ease, transform .55s ease';});
  const reveal=()=>{const h=window.innerHeight||800;els.forEach(el=>{if(el.dataset.shown)return;const r=el.getBoundingClientRect();if(r.top<h*0.93){el.style.opacity='1';el.style.transform='none';el.dataset.shown='1';}});};
  reveal();setTimeout(reveal,60);
  const sc=document.getElementById('content');
  window.addEventListener('scroll',reveal,{passive:true});
  if(sc)sc.addEventListener('scroll',reveal,{passive:true});
}

function renderPayment(){
  if(!billingName)billingName=defaultBilling();
  const opt=(id,t,d)=>`<div class="pay-opt ${payMethod===id?'on':''}" onclick="setPay('${id}')"><div class="radio"></div><div><div class="t">${t}</div>${d?`<div class="d">${d}</div>`:''}</div></div>`;
  let items=cart.map(c=>`<div class="sumrow"><span>${c.name}<br><span style="font-size:11px;color:var(--muted)">名札：${composeLabel(c.label)||'—'}</span></span><span>${yen(c.price)}</span></div>`).join('');
  items+=Object.values(upsell).map(u=>{const pc=cart.find(x=>x.uid===u.uid);const pl=pc?(composeLabel(pc.label)||pc.name):'';const q=u.qty||1;return `<div class="sumrow"><span>${esc(u.name)}${q>1?` <span style="font-size:11.5px;color:var(--muted)">× ${q}</span>`:''}<br><span style="font-size:11px;color:var(--muted)">${esc(pl)} のお花に${q>1?`（単価 ${yen(u.price)}）`:''}</span></span><span>${yen(u.price*q)}</span></div>`;}).join('');
  const kugePrev='';  // 名札プレビューは別スコープのため表示しない
  const on=orderer.kind==='corporate'?(esc(orderer.company)+'　'+(orderer.sei+' '+orderer.mei).trim()+' 様'):((orderer.sei+' '+orderer.mei).trim()+' 様');
  const isReceipt=payMethod==='card';
  const billLabel=isReceipt?'領収書宛名':'請求先宛名';
  const billing=`<div class="card"><div class="fld" style="margin-bottom:0"><label>${billLabel} <span class="req">*</span></label><input value="${esc(billingName)}" placeholder="${isReceipt?'領収書のお宛名':'ご請求書のお宛名'}" oninput="setBilling(this.value)"><div class="hint" style="margin-top:5px">${isReceipt?'領収書のお宛名です。':'ご請求書・お振込のお宛名です。'}初期値はご注文者名です。</div></div></div>`;
  const billRow=`<div class="sumrow"><span>${billLabel}</span><span>${esc(billingName)||'—'} 様</span></div>`;
  C().innerHTML=`<div class="sec-lead mser"><i class="fas fa-credit-card"></i> お支払い方法</div>
    ${opt('invoice','請求書払い（郵送）','コンビニ・郵便局・PayPay・銀行振込でお支払い')}
    ${opt('card','クレジットカード','')}
    ${opt('bank','銀行振込','お振込用の請求書をメールでお届けします')}
    ${opt('hall','会場支払い','葬儀会場でお支払い')}
    ${billing}
    <div class="sec-lead mser" style="margin-top:20px"><i class="fas fa-receipt"></i> ご注文内容（${cart.length}件）</div>
    <div class="card">${items}<div class="sumrow"><span>ご注文者</span><span>${on}</span></div>${billRow}<div class="sumrow"><span>メール</span><span style="font-size:12px">${orderer.email||'—'}</span></div><div class="sumrow total"><span>お支払い金額</span><span>${yen(cartTotal())}</span></div></div>${kugePrev}`;
}
function setPay(id){payMethod=id;renderPayment();renderBar();}
function setBilling(v){billingName=v;renderBar();}
function defaultBilling(){return orderer.kind==='corporate'?(orderer.company||''):((orderer.sei+' '+orderer.mei).trim());}

function renderComplete(){
  document.getElementById('stepper').style.display='none';
  let items=cart.map(c=>`<div class="sumrow"><span>${c.name}<br><span style="font-size:11px;color:var(--muted)">名札：${composeLabel(c.label)}</span></span><span>${yen(c.price)}</span></div>`).join('');
  items+=Object.values(upsell).map(u=>{const pc=cart.find(x=>x.uid===u.uid);const pl=pc?(composeLabel(pc.label)||pc.name):'';const q=u.qty||1;return `<div class="sumrow"><span>${esc(u.name)}${q>1?` <span style="font-size:11.5px;color:var(--muted)">× ${q}</span>`:''}<br><span style="font-size:11px;color:var(--muted)">${esc(pl)} のお花に${q>1?`（単価 ${yen(u.price)}）`:''}</span></span><span>${yen(u.price*q)}</span></div>`;}).join('');
  C().innerHTML=`<div class="complete"><div class="ico"><i class="fas fa-check"></i></div>
    <div class="mser" style="font-size:20px;margin-bottom:8px">ご注文ありがとうございました</div>
    <div class="hint" style="margin-bottom:22px">${FUNERAL.fam}家 御葬儀に際し、心よりお悔やみ申し上げます。<br>ご注文内容の控えを ${orderer.email} 宛にお送りしました。</div>
    <div class="card" style="text-align:left;max-width:460px;margin:0 auto">${items}<div class="sumrow"><span>お支払い</span><span>${({invoice:'請求書払い（郵送）',card:'クレジットカード',bank:'銀行振込',hall:'会場支払い'})[payMethod]}</span></div><div class="sumrow total"><span>合計</span><span>${yen(cartTotal())}</span></div></div>
    <button class="btn btn-p" style="margin-top:22px;max-width:320px" onclick="location.reload()">追悼ページに戻る</button></div>`;
  document.querySelector('.botbar').style.display='none';
}

function allLabels(){return cart.length>0&&cart.every(c=>labelFilledOne(c.label,c.cat));}
function validEmail(v){return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v);}
function ordererFilled(){const base=['sei','mei','phone','zip','pref','addr1','addr2'].every(k=>orderer[k].trim())&&validEmail(orderer.email.trim());return orderer.kind==='corporate'?(base&&orderer.company.trim()&&orderer.companyKana.trim()):base;}
function prevStep(){if(step===2.5)return 2;if(step===3)return cart.some(c=>c.cat==='kouden')?2.5:2;if(step===4)return 3.5;if(step===3.5)return 3;return step-1;}
function renderBar(){
  const bar=document.getElementById('botbar');const total=cartTotal();
  let can=false,lb='次へ',act='';
  if(step===1){can=cart.length>0;act='setStep(2)';}
  else if(step===2){can=allLabels();act='proceedFromLabel()';}
  else if(step===2.5){can=!!returnGift;act='setStep(3)';}
  else if(step===3){can=ordererFilled();act='setStep(3.5)';}
  else if(step===3.5){can=true;lb=(Object.keys(upsell).length>0)?'お支払いへ進む':'そのままお支払いへ進む';act='setStep(4)';}
  else if(step===4){can=true;lb='この内容で注文する';act='submitOrder()';}
  if(step===1){
    const groups={};cart.forEach(c=>{groups[c.name]=(groups[c.name]||0)+1;});
    const summary=Object.entries(groups).map(([nm,q])=>`${esc(nm)} <b style="color:var(--ink)">×${q}</b>`).join('　／　');
    bar.innerHTML=`<div style="width:100%;display:flex;flex-direction:column;gap:8px">
      <div style="font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch"><i class="fas fa-basket-shopping" style="color:var(--gold);flex-shrink:0"></i>${cart.length?`<span>${summary}</span>`:'<span>お供えを選択してください</span>'}</div>
      <div style="display:flex;align-items:center;gap:12px"><div style="flex:0 0 auto"><div class="tt">お支払い（${cart.length}件）</div><div class="tv">${yen(total)}</div></div><button class="btn btn-p" ${can?'':'disabled'} onclick="${act}" style="margin-left:auto;white-space:nowrap;font-size:13px;padding-left:16px;padding-right:16px">${lb}</button></div>
    </div>`;
    return;
  }
  const back=step>1?`<button class="btn btn-g" onclick="setStep(${prevStep()})">戻る</button>`:'';
  bar.innerHTML=`${back}<div style="flex:0 0 auto;margin-right:4px"><div class="tt">お支払い</div><div class="tv">${yen(total)}</div></div><button class="btn btn-p" ${can?'':'disabled'} onclick="${act}" style="white-space:nowrap;font-size:13px;padding-left:16px;padding-right:16px">${lb}</button>`;
}
function catLabelOf(id){return ({kuge:'供花・供物',telegram:'弔電',kouden:'香典'})[id]||id;}
function availCats(){return ['kuge','telegram','kouden'].filter(id=>PRODUCTS.some(p=>p.cat===id));}
function missingCats(){const inCart=new Set(cart.map(c=>c.cat));return availCats().filter(id=>!inCart.has(id));}
function proceedFromLabel(){
  if(!crossSellShown){const m=missingCats();if(m.length){crossSellShown=true;document.getElementById('cross-msg').innerHTML='一緒に「'+m.map(catLabelOf).join('・')+'」もお送りになりませんか？';document.getElementById('crossModal').classList.add('show');return;}}
  goAfterLabel();
}
function crossGoProducts(){document.getElementById('crossModal').classList.remove('show');setStep(1);}
function crossGoOrderer(){document.getElementById('crossModal').classList.remove('show');goAfterLabel();}
function goAfterLabel(){if(cart.some(c=>c.cat==='kouden'))setStep(2.5);else setStep(3);}
function renderReturnGift(){
  const kd=cart.find(c=>c.cat==='kouden');
  let html=`<div class="sec-lead mser">香典返しをお選びください</div>`;
  html+=`<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px"><div><div style="font-size:11px;color:var(--muted)">選択中の香典</div><div style="font-weight:600;font-size:15px">${kd?esc(kd.name):'香典'}</div></div><div style="font-weight:600;font-size:15px;white-space:nowrap">${kd?yen(kd.price):''}</div></div>`;
  html+=`<div class="card" style="border-left:4px solid var(--primary);background:var(--soft);display:flex;gap:10px;margin-bottom:14px;padding:12px 14px"><i class="fas fa-circle-info" style="color:var(--primary);margin-top:2px"></i><div style="flex:1"><div style="font-weight:600;font-size:13px;margin-bottom:4px">香典返しのお届けについて</div><div style="font-size:12px;color:var(--muted);line-height:1.6">お選びいただいた香典返しは、<b style="color:var(--ink)">ご注文者さま宛て</b>にお届けします。</div><div style="font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:7px;margin-top:7px">のし・掛け紙は葬儀社の設定に従います。</div></div></div>`;
  html+=`<div role="radiogroup">`+RETURN_GIFTS.map(g=>`<div class="pcard" style="${returnGift===g.id?'border-color:var(--gold);box-shadow:0 2px 12px rgba(176,146,90,.18);':''}margin-bottom:10px" onclick="setReturnGift('${g.id}')"><div class="pcard-img" style="width:66px;flex:0 0 66px;display:flex;align-items:center;justify-content:center;color:#c3bba8"><img src="${IMG}" alt=""></div><div class="pcard-body"><div class="pnm">${g.name}</div><div class="pcode">${g.desc}</div><div class="pcard-foot" style="justify-content:flex-end">${returnGift===g.id?'<i class="fas fa-circle-check" style="color:var(--gold);font-size:20px"></i>':''}</div></div></div>`).join('')+`</div>`;
  C().innerHTML=html;
}
function setReturnGift(id){returnGift=id;renderReturnGift();renderBar();}
function submitOrder(){const pm=({invoice:'請求書払い（郵送）',card:'クレジットカード',bank:'銀行振込',hall:'会場支払い'})[payMethod];if(payMethod==='card'){if(!confirm('クレジットカード決済に進みます。よろしいですか？'))return;}else if(!confirm(pm+'で注文します。SMS認証に進む場合があります。よろしいですか？'))return;setStep(5);}
(function(){const el=document.getElementById("mhead-name");if(el)el.textContent="故人　"+FUNERAL.fam+"　様";})();
function seedCart(){if(cart.length)return;const mk=(code,name,note)=>{const p=PRODUCTS.find(x=>x.code===code);const l=emptyLabel();l.kind='individual';l.names[0].name=name;l.note=note||'';return {uid:++uidC,code:p.code,cat:p.cat,catL:p.catL,name:p.name,price:p.price,label:l};};cart.push(mk('F001','株式会社いとわ\n代表取締役　山田 太郎',''));cart.push(mk('F002','山田 太郎',''));}
seedCart();render();
</script>
</body></html>
